  - op: container.name_list
    path: /containers/list
    module: container
    risk: read
    desc: {zh: 只列容器名，用于选择, en: List container names}
  - op: container.status
    path: /containers/status
    module: container
    risk: read
    desc: {zh: 各状态的容器计数, en: Load containers status}
  - op: container.info
    path: /containers/info
    module: container
    risk: read
    desc: {zh: 查一个容器的创建参数, en: Load container info}
  - op: container.inspect
    path: /containers/inspect
    module: container
    risk: read
    desc: {zh: docker inspect 的原始输出, en: Container inspect}
  - op: container.logs
    path: /containers/search/log
    module: container
    risk: read
    desc: {zh: 查容器日志, en: Container logs}
