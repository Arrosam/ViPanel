# ViPanel MCP 工具目录的**唯一人工评审面**。
#
# 规矩（MCP.md §5）：
#   - swagger 里的每个端点，要么在 ops 里被收录，要么在 excluded 里被显式排除，
#     否则 CI 报错。上游 rebase 后新加的端点默认是**关**的，必须有人看过才开。
#   - 板块标 status: pending 时，该板块下未分类的端点只警告不报错，方便分批铺开。
#     标 done 之后就是硬门槛。
#   - risk 只有 read / write / destructive 三档，它决定的是「转述给人时打扰得多重」，
#     不是第二套策略引擎。
#   - fixed 用来把 /containers/operate 这种多路复用端点拆成一个动作一个工具。
#     不拆的话「重启容器」和「删除容器」会共用同一个风险档。
#
# 改完跑：go run ./cmd/mcpgen -root ..

modules:
  - key: app
    title: 应用
    desc: 应用商店/已装应用
    status: done
  - key: website
    title: 网站
    desc: 网站/域名/nginx/PHP
    status: done
  - key: cert
    title: 证书
    desc: SSL证书/ACME/CA/DNS账号
    status: done
  - key: container
    title: 容器
    desc: 容器/镜像/网络/卷/compose
    status: done
  - key: database
    title: 数据库
    desc: MySQL/PG/Mongo/Redis
    status: done
  - key: cron
    title: 计划任务
    desc: 计划任务/脚本库
    status: done
  - key: backup
    title: 备份
    desc: 备份账号/快照
    status: done
  - key: firewall
    title: 防火墙
    desc: 防火墙/端口/IP
    status: done
  - key: ssh
    title: SSH
    desc: SSH配置/会话
    status: done
  - key: system
    title: 系统
    desc: 磁盘/进程/设备
    status: done
  - key: runtime
    title: 运行环境
    desc: PHP/Node/Java/Go/Python 环境
    status: done
  - key: monitor
    title: 监控
    desc: 仪表盘/告警/日志
    status: done
  - key: toolbox
    title: 工具箱
    desc: clam/fail2ban/FTP/supervisor
    status: done
  - key: setting
    title: 面板设置
    desc: 面板设置/用户
    status: done
  - key: ai
    title: AI
    desc: ollama/GPU/模型账号/agents
    status: done

# --- 显式排除 ---------------------------------------------------------------
# /ai/console/** 不需要写在这里，生成器无条件丢弃它（提权洞，MCP.md §1.1）。
excluded:
  - prefix: /files
    reason: agent 自带 Read/Write/Bash，面板文件接口没有一条是它够不着的（MCP.md §1.2）

  - prefix: /auth
    reason: 登录/登出/2FA 校验，agent 没有理由碰

  - prefix: /core/
    reason: core 侧接口，agent socket 上够不着

  - prefix: /containers/files/
    reason: 容器内文件读写，agent 用 docker exec 更直接，且没有 25k 输出上限

  - paths:
      - /process/ws
      - /websites/exec/composer
      - /hosts/terminal/local
      - /hosts/terminal/ssh
      - /hosts/terminal/container
    reason: 长连接/流式端点，不适合 MCP 的请求-响应模型；终端 agent 自带 Bash

  - paths:
      - /health/check
    reason: 面板自检，对 agent 无意义

  - paths:
      - /dashboard/system/restart/:operation
    reason: |
      重启面板会切断发起这次调用的会话自己（agent 进程、钩子、MCP 连接一起没），
      重启主机则用 Bash 更直接。两种结果都不该由一个 MCP 工具触发。

  - paths:
      - /apps/icon/:key
      - /containers/download/log
      - /websites/ca/download
      - /websites/ssl/download
    reason: 返回二进制/文件流，塞进对话没有意义

  - paths:
      - /apps/detail/node/:appKey/:version
      - /websites/ssl/push
      - /websites/ssl/import
    reason: 多节点分发，属于上游商业版范围（MCP.md §7）

  - paths:
      - /apps/installed/sort/update
      - /dashboard/app/launcher
      - /dashboard/app/launcher/option
      - /dashboard/app/launcher/show
      - /dashboard/quick/change
      - /dashboard/quick/option
    reason: 纯 UI 布局与排序，不改变任何实际状态

  - paths:
      - /dashboard/current/node
    reason: 多节点指标，属于上游商业版范围

  - paths:
      - /ai/agents/channel/feishu/get
      - /ai/agents/channel/feishu/update
      - /ai/agents/channel/telegram/get
      - /ai/agents/channel/telegram/update
      - /ai/agents/channel/discord/get
      - /ai/agents/channel/discord/update
      - /ai/agents/channel/wecom/get
      - /ai/agents/channel/wecom/update
      - /ai/agents/channel/dingtalk/get
      - /ai/agents/channel/dingtalk/update
      - /ai/agents/channel/weixin/get
      - /ai/agents/channel/weixin/login
      - /ai/agents/channel/qqbot/get
      - /ai/agents/channel/qqbot/update
      - /ai/agents/channel/delete
      - /ai/agents/channel/pairing/approve
    reason: |
      Agent 的即时通讯渠道配置里装的是各家平台的 bot token 和 webhook 密钥。
      让 agent 读写这些等于给它一条把自己接到外部通讯渠道、并把凭据取走的路，
      收益远小于风险。要配这些请在面板上手动做。

  - paths:
      - /websites/ssl/upload/file
    reason: multipart 上传，MCP 传不了文件；证书内容走 /websites/ssl/upload

# --- 收录的 op --------------------------------------------------------------
ops:
  # ========================= app =========================
  - op: app.list
    path: /apps/installed/list
    module: app
    risk: read
    resident: true
    desc: {zh: 列出已安装的应用, en: List installed apps}
  - op: app.installed_search
    path: /apps/installed/search
    module: app
    risk: read
    desc: {zh: 分页查询已安装应用，可按名称/类型过滤, en: Page installed apps}
    fields: [id, name, appKey, version, status, httpPort, httpsPort, path]
  - op: app.store_search
    path: /apps/search
    module: app
    risk: read
    desc: {zh: 搜索应用商店，可按名称/分类/推荐过滤, en: Search app store}
    fields: [key, name, shortDescZh, type, status, installed, tags, versions]
  - op: app.store_get
    path: /apps/:key
    module: app
    risk: read
    desc: {zh: 按 key 查应用商店里的一个应用, en: Get store app by key}
  - op: app.store_detail
    path: /apps/details/:id
    module: app
    risk: read
    desc: {zh: 按 id 查应用详情, en: Get app detail by id}
  - op: app.store_version
    path: /apps/detail/:appId/:version/:type
    module: app
    risk: read
    desc: {zh: 查某个应用某个版本的详情，安装前需要它给出 appDetailId, en: Get app version detail}
  - op: app.store_services
    path: /apps/services/:key
    module: app
    risk: read
    desc: {zh: 查某类应用可用的服务实例（建站选数据库时用）, en: List app services by key}
  - op: app.store_tags
    path: /apps/tags
    module: app
    risk: read
    desc: {zh: 列出应用商店的分类标签, en: List app tags}
  - op: app.store_check_update
    path: /apps/checkupdate
    module: app
    risk: read
    desc: {zh: 检查应用商店是否有更新, en: Check app store update}
  - op: app.store_sync_local
    path: /apps/sync/local
    module: app
    risk: write
    desc: {zh: 同步本地应用商店列表, en: Sync local app list}
  - op: app.store_sync_remote
    path: /apps/sync/remote
    module: app
    risk: write
    desc: {zh: 从远端同步应用商店列表, en: Sync remote app list}
  - op: app.install
    path: /apps/install
    module: app
    risk: write
    desc: {zh: 安装应用。异步执行，返回后用 vipanel_task 查进度, en: Install app}
  - op: app.info
    path: /apps/installed/info/:appInstallId
    module: app
    risk: read
    desc: {zh: 查已安装应用的基本信息, en: Get installed app info}
  - op: app.installed_check
    path: /apps/installed/check
    module: app
    risk: read
    desc: {zh: 检查某个应用是否已安装, en: Check app installed}
  - op: app.params
    path: /apps/installed/params/:appInstallId
    module: app
    risk: read
    desc: {zh: 查已安装应用的可配置参数, en: Get installed app params}
  - op: app.params_update
    path: /apps/installed/params/update
    module: app
    risk: write
    desc: {zh: 修改已安装应用的参数，会重建容器, en: Update app params}
  - op: app.default_conf
    path: /apps/installed/conf
    module: app
    risk: read
    desc: {zh: 查某类应用的默认配置文件内容, en: Get app default config}
  - op: app.conninfo
    path: /apps/installed/conninfo
    module: app
    risk: write
    desc: {zh: 查应用的连接信息，**包含密码**。因为会吐出凭据，故按变更类对待、每次都要人确认, en: Get app connection info (contains password)}
    noAlways: true
  - op: app.loadport
    path: /apps/installed/loadport
    module: app
    risk: read
    desc: {zh: 查某类应用当前占用的端口, en: Get app port}
  - op: app.config_update
    path: /apps/installed/config/update
    module: app
    risk: write
    desc: {zh: 修改已安装应用的配置文件, en: Update app config file}
  - op: app.port_change
    path: /apps/installed/port/change
    module: app
    risk: write
    desc: {zh: 修改已安装应用对外暴露的端口, en: Change app port}
  - op: app.sync_installed
    path: /apps/installed/sync
    module: app
    risk: write
    desc: {zh: 同步已安装应用的实际运行状态, en: Sync installed app status}
  - op: app.upgrade_versions
    path: /apps/installed/update/versions
    module: app
    risk: read
    desc: {zh: 查某个已安装应用可升级到的版本, en: List upgradable versions}
  - op: app.delete_check
    path: /apps/installed/delete/check/:appInstallId
    module: app
    risk: read
    desc: {zh: 删除前检查，列出会被一并影响的资源, en: Check before delete}
  - op: app.ignore_upgrade
    path: /apps/installed/ignore
    module: app
    risk: write
    desc: {zh: 忽略某个应用的升级提示, en: Ignore app upgrade}
  - op: app.ignore_cancel
    path: /apps/ignored/cancel
    module: app
    risk: write
    desc: {zh: 取消忽略某个应用的升级提示, en: Cancel ignore app upgrade}
  - op: app.ignored_list
    path: /apps/ignored/detail
    module: app
    risk: read
    desc: {zh: 列出被忽略升级的应用, en: List ignored apps}

  # /apps/installed/op 是多路复用端点，AppOperate 里含 delete。
  # 拆成一个动作一个工具，否则「重启应用」和「删除应用」共用同一个风险档。
  - op: app.start
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: start}
    desc: {zh: 启动已安装的应用, en: Start installed app}
  - op: app.stop
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: stop}
    desc: {zh: 停止已安装的应用, en: Stop installed app}
  - op: app.restart
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: restart}
    desc: {zh: 重启已安装的应用, en: Restart installed app}
  - op: app.rebuild
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: rebuild}
    desc: {zh: 重建应用容器（参数改动后生效）, en: Rebuild app container}
  - op: app.upgrade
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: upgrade}
    desc: {zh: 升级应用到指定版本。异步执行，用 vipanel_task 查进度, en: Upgrade app}
  - op: app.backup
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: backup}
    desc: {zh: 备份应用, en: Backup app}
  - op: app.delete
    path: /apps/installed/op
    module: app
    risk: destructive
    fixed: {operate: delete}
    desc: {zh: 卸载应用。可选一并删除数据库、备份和镜像，不可恢复, en: Uninstall app}
    noAlways: true

  # ========================= website =========================
  - op: website.list
    path: /websites/list
    module: website
    risk: read
    resident: true
    desc: {zh: 列出全部网站, en: List websites}
  - op: website.search
    path: /websites/search
    module: website
    risk: read
    desc: {zh: 分页查询网站，可按域名/分组过滤, en: Page websites}
    fields: [id, primaryDomain, alias, type, status, expireDate, runtimeName]
  - op: website.get
    path: /websites/:id
    module: website
    risk: read
    desc: {zh: 按 id 查一个网站的详情, en: Get website by id}
  - op: website.options
    path: /websites/options
    module: website
    risk: read
    desc: {zh: 列出网站名称选项, en: List website names}
  - op: website.create
    path: /websites
    module: website
    risk: write
    desc: {zh: 创建网站, en: Create website}
  - op: website.create_check
    path: /websites/check
    module: website
    risk: read
    desc: {zh: 建站前检查依赖（nginx 是否装好等）, en: Check before create website}
  - op: website.update
    path: /websites/update
    module: website
    risk: write
    desc: {zh: 更新网站基本设置, en: Update website}
  - op: website.delete
    path: /websites/del
    module: website
    risk: destructive
    desc: {zh: 删除网站。可选一并删除关联应用、数据库和备份，不可恢复, en: Delete website}
    noAlways: true
  - op: website.start
    path: /websites/operate
    module: website
    risk: write
    fixed: {operate: start}
    desc: {zh: 启用网站, en: Start website}
  - op: website.stop
    path: /websites/operate
    module: website
    risk: write
    fixed: {operate: stop}
    desc: {zh: 停用网站, en: Stop website}
  - op: website.batch_operate
    path: /websites/batch/operate
    module: website
    risk: write
    desc: {zh: 批量启停网站, en: Batch operate websites}
  - op: website.batch_group
    path: /websites/batch/group
    module: website
    risk: write
    desc: {zh: 批量设置网站分组, en: Batch set website group}
  - op: website.batch_ssl
    path: /websites/batch/ssl
    module: website
    risk: write
    desc: {zh: 批量为网站配置 HTTPS, en: Batch set HTTPS}
  - op: website.group_change
    path: /websites/group/change
    module: website
