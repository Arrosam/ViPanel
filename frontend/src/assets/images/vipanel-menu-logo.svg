<!--
  ViPanel 的方形标。33x33，和它替换掉的那个同尺寸，侧栏收起时也是用这个。

  几何是原创的：一个圆角方块（面板）挖出一个 V。**没有沿用上游那个等距六边形**——
  去品牌化的目的是别让人误以为有关联，做一个高仿只会把这件事做反。

  用 currentColor 和 evenodd：前者让它跟着主题走（浅色/深色/折叠态都靠它），
  后者是 V 被"挖空"而不是"画上去"的原因——挖空在 20px 以下仍然认得出，
  叠画的细线会糊成一团。
-->
<svg width="33" height="33" viewBox="0 0 33 33" fill="currentColor"
     fill-rule="evenodd" clip-rule="evenodd" xmlns="http://www.w3.org/2000/svg">
  <path d="M9.4 2.5h14.2a6.9 6.9 0 0 1 6.9 6.9v14.2a6.9 6.9 0 0 1-6.9 6.9H9.4a6.9 6.9 0 0 1-6.9-6.9V9.4a6.9 6.9 0 0 1 6.9-6.9Z
           M8.9 9.3h4.3l3.3 9.1 3.3-9.1h4.3l-5.4 14.4h-4.4L8.9 9.3Z"/>
</svg>
