  # ========================= cert =========================
  - op: cert.ssl_list
    path: /websites/ssl/list
    module: cert
    risk: read
    desc: {zh: 列出全部 SSL 证书, en: List SSL certificates}
  - op: cert.ssl_search
    path: /websites/ssl/search
    module: cert
    risk: read
    desc: {zh: 分页查询 SSL 证书, en: Page SSL certificates}
    fields: [id, primaryDomain, status, expireDate, provider, autoRenew]
  - op: cert.ssl_get
    path: /websites/ssl/:id
    module: cert
    risk: read
    desc: {zh: 按 id 查一张证书, en: Get SSL by id}
  - op: cert.ssl_by_website
    path: /websites/ssl/website/:websiteId
    module: cert
    risk: read
    desc: {zh: 查某个网站正在用的证书, en: Get SSL by website id}
  - op: cert.ssl_create
    path: /websites/ssl
    module: cert
    risk: write
    desc: {zh: 创建证书申请任务, en: Create website SSL}
  - op: cert.ssl_obtain
    path: /websites/ssl/obtain
    module: cert
    risk: write
    desc: {zh: 申请/续签证书。异步执行，用 vipanel_task 查进度, en: Apply SSL}
  - op: cert.ssl_update
    path: /websites/ssl/update
    module: cert
    risk: write
    desc: {zh: 修改证书设置（自动续签等）, en: Update SSL settings}
  - op: cert.ssl_upload
    path: /websites/ssl/upload
    module: cert
    risk: write
    desc: {zh: 粘贴证书内容导入一张已有证书, en: Upload SSL by content}
  - op: cert.ssl_resolve
    path: /websites/ssl/resolve
    module: cert
    risk: read
    desc: {zh: 解析 DNS 校验记录，申请证书前用, en: Resolve DNS challenge}
  - op: cert.ssl_delete
    path: /websites/ssl/del
    module: cert
    risk: destructive
    desc: {zh: 删除证书。正在使用它的网站会失去 HTTPS, en: Delete SSL}
    noAlways: true
  - op: cert.acme_search
    path: /websites/acme/search
    module: cert
    risk: read
    desc: {zh: 列出 ACME 账号, en: Page ACME accounts}
  - op: cert.acme_create
    path: /websites/acme
    module: cert
    risk: write
    desc: {zh: 添加 ACME 账号, en: Create ACME account}
  - op: cert.acme_update
    path: /websites/acme/update
    module: cert
    risk: write
    desc: {zh: 修改 ACME 账号, en: Update ACME account}
  - op: cert.acme_delete
    path: /websites/acme/del
    module: cert
    risk: destructive
    desc: {zh: 删除 ACME 账号，用它签发的证书将无法自动续签, en: Delete ACME account}
  - op: cert.ca_search
    path: /websites/ca/search
    module: cert
    risk: read
    desc: {zh: 列出自建 CA, en: Page CAs}
  - op: cert.ca_get
    path: /websites/ca/{id}
    module: cert
    risk: read
    desc: {zh: 按 id 查一个自建 CA, en: Get CA by id}
  - op: cert.ca_create
    path: /websites/ca
    module: cert
    risk: write
    desc: {zh: 创建自建 CA, en: Create CA}
  - op: cert.ca_obtain
    path: /websites/ca/obtain
    module: cert
    risk: write
    desc: {zh: 用自建 CA 签发一张自签证书, en: Obtain self-signed SSL from CA}
  - op: cert.ca_renew
    path: /websites/ca/renew
    module: cert
    risk: write
    desc: {zh: 用自建 CA 续签自签证书, en: Renew self-signed SSL}
  - op: cert.ca_delete
    path: /websites/ca/del
    module: cert
    risk: destructive
    desc: {zh: 删除自建 CA，它签发过的证书将无法续签, en: Delete CA}
  - op: cert.dns_search
    path: /websites/dns/search
    module: cert
    risk: read
    desc: {zh: 列出 DNS 服务商账号, en: Page DNS accounts}
  - op: cert.dns_create
    path: /websites/dns
    module: cert
    risk: write
    desc: {zh: 添加 DNS 服务商账号（用于 DNS 校验签证书）, en: Create DNS account}
  - op: cert.dns_update
    path: /websites/dns/update
    module: cert
    risk: write
    desc: {zh: 修改 DNS 服务商账号, en: Update DNS account}
  - op: cert.dns_delete
    path: /websites/dns/del
    module: cert
    risk: destructive
    desc: {zh: 删除 DNS 服务商账号，依赖它的自动续签会失败, en: Delete DNS account}

