# ViPanel MCP 工具目录的**唯一人工评审面**。
#
# 规矩（MCP.md §5）：
#   - swagger 里的每个端点，要么在 ops 里被收录，要么在 excluded 里被显式排除，
#     否则 CI 报错。上游 rebase 后新加的端点默认是**关**的，必须有人看过才开。
#   - 板块标 status: pending 时，该板块下未分类的端点只警告不报错，方便分批铺开。
#     标 done 之后就是硬门槛。
#   - risk 只有 read / write / destructive 三档，它决定的是「转述给人时打扰得多重」，
#     不是第二套策略引擎。
#   - fixed 用来把 /containers/operate 这种多路复用端点拆成一个动作一个工具。
#     不拆的话「重启容器」和「删除容器」会共用同一个风险档。
#
# 改完跑：go run ./cmd/mcpgen -root ..

modules:
  - key: app
    title: 应用
    desc: 应用商店/已装应用
    status: done
  - key: website
    title: 网站
    desc: 网站/域名/nginx/PHP
    status: done
  - key: cert
    title: 证书
    desc: SSL证书/ACME/CA/DNS账号
    status: done
  - key: container
    title: 容器
    desc: 容器/镜像/网络/卷/compose
    status: done
  - key: database
    title: 数据库
    desc: MySQL/PG/Mongo/Redis
    status: pending
  - key: cron
    title: 计划任务
    desc: 计划任务/脚本库
    status: pending
  - key: backup
    title: 备份
    desc: 备份账号/快照
    status: pending
  - key: firewall
    title: 防火墙
    desc: 防火墙/端口/IP
    status: pending
  - key: ssh
    title: SSH
    desc: SSH配置/会话
    status: pending
  - key: system
    title: 系统
    desc: 磁盘/进程/设备
    status: pending
  - key: runtime
    title: 运行环境
    desc: PHP/Node/Java/Go/Python 环境
    status: pending
  - key: monitor
    title: 监控
    desc: 仪表盘/告警/日志
    status: pending
  - key: toolbox
    title: 工具箱
    desc: clam/fail2ban/FTP/supervisor
    status: pending
  - key: setting
    title: 面板设置
    desc: 面板设置/用户
    status: pending
  - key: ai
    title: AI
    desc: ollama/GPU/模型账号/agents
    status: pending

# --- 显式排除 ---------------------------------------------------------------
# /ai/console/** 不需要写在这里，生成器无条件丢弃它（提权洞，MCP.md §1.1）。
excluded:
  - prefix: /files
    reason: agent 自带 Read/Write/Bash，面板文件接口没有一条是它够不着的（MCP.md §1.2）

  - prefix: /auth
    reason: 登录/登出/2FA 校验，agent 没有理由碰

  - prefix: /core/
    reason: core 侧接口，agent socket 上够不着

  - prefix: /containers/files/
    reason: 容器内文件读写，agent 用 docker exec 更直接，且没有 25k 输出上限

  - paths:
      - /process/ws
      - /websites/exec/composer
    reason: 长连接/流式端点，不适合 MCP 的请求-响应模型

  - paths:
      - /health/check
    reason: 面板自检，对 agent 无意义

  - paths:
      - /apps/icon/:key
      - /containers/download/log
      - /websites/ca/download
      - /websites/ssl/download
    reason: 返回二进制/文件流，塞进对话没有意义

  - paths:
      - /apps/detail/node/:appKey/:version
      - /websites/ssl/push
      - /websites/ssl/import
    reason: 多节点分发，属于上游商业版范围（MCP.md §7）

  - paths:
      - /apps/installed/sort/update
    reason: 纯 UI 排序，不改变任何实际状态

  - paths:
      - /websites/ssl/upload/file
    reason: multipart 上传，MCP 传不了文件；证书内容走 /websites/ssl/upload

# --- 收录的 op --------------------------------------------------------------
ops:
  # ========================= app =========================
  - op: app.list
    path: /apps/installed/list
    module: app
    risk: read
    resident: true
    desc: {zh: 列出已安装的应用, en: List installed apps}
  - op: app.installed_search
    path: /apps/installed/search
    module: app
    risk: read
    desc: {zh: 分页查询已安装应用，可按名称/类型过滤, en: Page installed apps}
    fields: [id, name, appKey, version, status, httpPort, httpsPort, path]
  - op: app.store_search
    path: /apps/search
    module: app
    risk: read
    desc: {zh: 搜索应用商店，可按名称/分类/推荐过滤, en: Search app store}
    fields: [key, name, shortDescZh, type, status, installed, tags, versions]
  - op: app.store_get
    path: /apps/:key
    module: app
    risk: read
    desc: {zh: 按 key 查应用商店里的一个应用, en: Get store app by key}
  - op: app.store_detail
    path: /apps/details/:id
    module: app
    risk: read
    desc: {zh: 按 id 查应用详情, en: Get app detail by id}
  - op: app.store_version
    path: /apps/detail/:appId/:version/:type
    module: app
    risk: read
    desc: {zh: 查某个应用某个版本的详情，安装前需要它给出 appDetailId, en: Get app version detail}
  - op: app.store_services
    path: /apps/services/:key
    module: app
    risk: read
    desc: {zh: 查某类应用可用的服务实例（建站选数据库时用）, en: List app services by key}
  - op: app.store_tags
    path: /apps/tags
    module: app
    risk: read
    desc: {zh: 列出应用商店的分类标签, en: List app tags}
  - op: app.store_check_update
    path: /apps/checkupdate
    module: app
    risk: read
    desc: {zh: 检查应用商店是否有更新, en: Check app store update}
  - op: app.store_sync_local
    path: /apps/sync/local
    module: app
    risk: write
    desc: {zh: 同步本地应用商店列表, en: Sync local app list}
  - op: app.store_sync_remote
    path: /apps/sync/remote
    module: app
    risk: write
    desc: {zh: 从远端同步应用商店列表, en: Sync remote app list}
  - op: app.install
    path: /apps/install
    module: app
    risk: write
    desc: {zh: 安装应用。异步执行，返回后用 vipanel_task 查进度, en: Install app}
  - op: app.info
    path: /apps/installed/info/:appInstallId
    module: app
    risk: read
    desc: {zh: 查已安装应用的基本信息, en: Get installed app info}
  - op: app.installed_check
    path: /apps/installed/check
    module: app
    risk: read
    desc: {zh: 检查某个应用是否已安装, en: Check app installed}
  - op: app.params
    path: /apps/installed/params/:appInstallId
    module: app
    risk: read
    desc: {zh: 查已安装应用的可配置参数, en: Get installed app params}
  - op: app.params_update
    path: /apps/installed/params/update
    module: app
    risk: write
    desc: {zh: 修改已安装应用的参数，会重建容器, en: Update app params}
  - op: app.default_conf
    path: /apps/installed/conf
    module: app
    risk: read
    desc: {zh: 查某类应用的默认配置文件内容, en: Get app default config}
  - op: app.conninfo
    path: /apps/installed/conninfo
