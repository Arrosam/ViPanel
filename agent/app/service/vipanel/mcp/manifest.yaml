    desc: {zh: 创建容器, en: Create container}
  - op: container.update
    path: /containers/update
    module: container
    risk: write
    desc: {zh: 修改容器配置，会重建容器, en: Update container}
  - op: container.upgrade
    path: /containers/upgrade
    module: container
    risk: write
    desc: {zh: 用新镜像重建容器, en: Upgrade container image}
  - op: container.rename
    path: /containers/rename
    module: container
    risk: write
