    path: /apps/installed/ignore
    module: app
    risk: write
    desc: {zh: 忽略某个应用的升级提示, en: Ignore app upgrade}
  - op: app.ignore_cancel
    path: /apps/ignored/cancel
    module: app
    risk: write
    desc: {zh: 取消忽略某个应用的升级提示, en: Cancel ignore app upgrade}
  - op: app.ignored_list
    path: /apps/ignored/detail
    module: app
    risk: read
    desc: {zh: 列出被忽略升级的应用, en: List ignored apps}

  # /apps/installed/op 是多路复用端点，AppOperate 里含 delete。
  # 拆成一个动作一个工具，否则「重启应用」和「删除应用」共用同一个风险档。
  - op: app.start
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: start}
    desc: {zh: 启动已安装的应用, en: Start installed app}
  - op: app.stop
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: stop}
    desc: {zh: 停止已安装的应用, en: Stop installed app}
  - op: app.restart
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: restart}
    desc: {zh: 重启已安装的应用, en: Restart installed app}
  - op: app.rebuild
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: rebuild}
    desc: {zh: 重建应用容器（参数改动后生效）, en: Rebuild app container}
  - op: app.upgrade
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: upgrade}
    desc: {zh: 升级应用到指定版本。异步执行，用 vipanel_task 查进度, en: Upgrade app}
  - op: app.backup
    path: /apps/installed/op
    module: app
    risk: write
    fixed: {operate: backup}
    desc: {zh: 备份应用, en: Backup app}
  - op: app.delete
    path: /apps/installed/op
    module: app
    risk: destructive
    fixed: {operate: delete}
    desc: {zh: 卸载应用。可选一并删除数据库、备份和镜像，不可恢复, en: Uninstall app}
    noAlways: true

