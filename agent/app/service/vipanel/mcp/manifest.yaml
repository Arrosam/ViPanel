    desc: {zh: 批量清理已停止的容器/无用镜像/网络/卷，按 pruneType 决定清什么，不可恢复, en: Prune containers/images/networks/volumes}
    noAlways: true

  # /containers/operate 的 operation 是 oneof=up start stop restart kill pause
  # unpause remove——remove 会删容器。拆开，风险档才说得清。
  - op: container.start
    path: /containers/operate
    module: container
    risk: write
    fixed: {operation: start}
    desc: {zh: 启动容器, en: Start container}
  - op: container.stop
    path: /containers/operate
    module: container
    risk: write
    fixed: {operation: stop}
    desc: {zh: 停止容器, en: Stop container}
  - op: container.restart
    path: /containers/operate
    module: container
    risk: write
    fixed: {operation: restart}
    desc: {zh: 重启容器, en: Restart container}
  - op: container.pause
    path: /containers/operate
    module: container
    risk: write
    fixed: {operation: pause}
    desc: {zh: 暂停容器, en: Pause container}
  - op: container.unpause
    path: /containers/operate
    module: container
    risk: write
    fixed: {operation: unpause}
    desc: {zh: 恢复被暂停的容器, en: Unpause container}
  - op: container.kill
    path: /containers/operate
    module: container
    risk: destructive
    fixed: {operation: kill}
    desc: {zh: 强杀容器，进程不会收到优雅退出的机会, en: Kill container}
  - op: container.remove
    path: /containers/operate
    module: container
    risk: destructive
    fixed: {operation: remove}
    desc: {zh: 删除容器，容器内未挂载的数据会丢失, en: Remove container}
    noAlways: true

